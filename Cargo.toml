[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
# The version without a release tag (`X.Y.Z-dev`); tags give the real one.
version = "2.0.0"
edition = "2024"
rust-version = "1.100.0"

[workspace.metadata.buildkit]
version = "0.3.0"
first-release = "2.0.0"
flow = "beta"
repo = "medaminben/Bowlingbox_R"

[workspace.metadata.bk.package]
display-name = "Bowlingbox"
main-app = "bowlingbox"
apps = ["bowlingbox"]
iss = "installer/bowlingbox.iss"
desktop = "packaging/bowlingbox.desktop"
icon = "packaging/icon.png"
extra-files = []
system-deps.apt = [
  "libxkbcommon0",
  "libwayland-client0",
  "libx11-6",
  "libxcursor1",
  "libxrandr2",
  "libxi6",
  "libvulkan1",
  "libgl1",
  "libasound2",
]

[workspace.dependencies]
buildkit = { git = "https://github.com/medaminben/buildkit-rust", tag = "v0.3.0" }
# The version eframe 0.37's egui-wgpu resolves to: one wgpu in the tree.
wgpu = "30.0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Physics runs every frame; unoptimised it can take longer than a frame when pins collide.
[profile.dev.package.rapier3d]
opt-level = 3

[profile.dev.package.parry3d]
opt-level = 3
