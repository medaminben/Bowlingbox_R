name: CI

on:
  push:
    branches: [main, Beta]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: medaminben/buildkit-rust/.github/workflows/ci.yml@v0.3.0
    permissions:
      contents: read
    with:
      # More inputs: apt-packages, xvfb, coverage, miri-crates, package, format-exclude.
      # See docs/CI_CD.md of buildkit-rust.
      # An input replaces system-deps.apt, so the list repeats it and adds the ALSA headers.
      apt-packages: >-
        libxkbcommon0 libwayland-client0 libx11-6 libxcursor1 libxrandr2 libxi6 libvulkan1 libgl1
        libasound2-dev
      timeout-minutes: 45
