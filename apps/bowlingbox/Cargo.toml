[package]
name = "bowlingbox"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
bowlingbox-score = { path = "../../crates/score" }
bowlingbox-lane = { path = "../../crates/lane" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"] }

# eframe trims winit's default features; this one brings back client-side window decorations
# (sctk-adwaita), so GNOME on Wayland draws a title bar.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[build-dependencies]
buildkit.workspace = true

[lints]
workspace = true
